<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" sizes="16x16" href="../icons/icon16.png" />
        <link rel="icon" type="image/png" sizes="48x48" href="../icons/icon48.png" />
        <title id="popupPageTitle">Rasid | راصد</title>
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <div class="popup-shell">
            <header class="popup-header">
                <div class="brand-mark">
                    <img src="../icons/icon128.png" alt="" />
                </div>
                <div class="brand-copy">
                    <h1 id="popupBrandTitle">Rasid</h1>
                    <p id="popupBrandTagline">راصد فرص العمل الحر والردود السريعة</p>
                </div>
                <button
                    id="langToggleBtn"
                    class="lang-toggle-btn"
                    type="button"
                    aria-label="Toggle language"
                >
                    <i class="fas fa-globe"></i>
                    <span id="langToggleText">EN</span>
                </button>
            </header>

            <main class="popup-content">
                <div
                    id="adminMessagesBanner"
                    class="admin-messages-banner hidden"
                    role="alert"
                    aria-live="assertive"
                >
                    <div class="admin-msg-header">
                        <span class="admin-msg-icon"><i class="fas fa-bell"></i></span>
                        <span id="adminMessagesTitle" class="admin-msg-title"
                            >تنبيهات من المطورين</span
                        >
                        <span id="adminMessagesBadge" class="admin-msg-badge hidden"></span>
                        <button
                            id="dismissAdminMessageBtn"
                            class="admin-msg-dismiss"
                            type="button"
                            aria-label="إغلاق الرسالة"
                        >
                            ✕
                        </button>
                    </div>
                    <p id="adminMessageText" class="admin-msg-text"></p>
                    <a
                        id="adminMessageLink"
                        class="admin-msg-link hidden"
                        href="#"
                        target="_blank"
                        rel="noreferrer noopener"
                    >
                        <i class="fas fa-external-link-alt"></i>
                        <span id="adminMessageLinkText">عرض التفاصيل</span>
                    </a>
                </div>

                <section id="statsPanelSection" class="stats-panel" aria-label="إحصائيات الرصد">
                    <div class="stat-box">
                        <span id="todayCountLabel" class="stat-label">مشاريع اليوم</span>
                        <strong class="stat-num" id="todayCount">0</strong>
                    </div>
                    <div class="stat-box">
                        <span id="totalSeenLabel" class="stat-label">إجمالي الرصد</span>
                        <strong class="stat-num" id="totalSeen">0</strong>
                    </div>
                </section>

                <div class="status-indicator" aria-live="polite">
                    <span class="dot active"></span>
                    <span id="lastCheck">جاري التحميل...</span>
                </div>

                <section id="mainActionsSection" class="main-actions" aria-label="إجراءات سريعة">
                    <button id="open-dashboard-btn" class="btn action primary" type="button">
                        <i class="fas fa-desktop"></i>
                        <span id="openDashboardBtnText">فتح لوحة التحكم</span>
                    </button>
                    <button id="checkNowBtn" class="btn action secondary" type="button">
                        <i class="fas fa-sync-alt"></i>
                        <span id="checkNowBtnText">فحص الآن</span>
                    </button>
                    <button id="toggleNotificationsBtn" class="btn action secondary" type="button">
                        <i class="fas fa-bell"></i>
                        <span id="toggleNotificationsBtnText">الإشعارات: مفعلة</span>
                    </button>
                    <button id="checkConnectionBtn" class="btn diagnostic" type="button">
                        <i class="fas fa-plug"></i>
                        <span id="checkConnectionBtnText">فحص الاتصال بالمصادر</span>
                    </button>
                </section>

                <div
                    id="connectionReport"
                    class="connection-report hidden"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></div>
            </main>

            <footer class="popup-footer">
                <a
                    id="footerMostaqlLink"
                    href="https://mostaql.com/projects"
                    target="_blank"
                    rel="noreferrer"
                    >مستقل</a
                >
                <a
                    id="footerKhamsatLink"
                    href="https://khamsat.com/community/requests"
                    target="_blank"
                    rel="noreferrer"
                    >خمسات</a
                >
                <a
                    id="footerNafezlyLink"
                    href="https://nafezly.com/projects"
                    target="_blank"
                    rel="noreferrer"
                    >نفذلي</a
                >
            </footer>
        </div>
    </body>
</html>
